hydra:
  # Search path for the local TTRL/verl trainer configs.
  searchpath:
    - file:///mlx_devbox/users/quyanyi/playground/TTRL/verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}

reward_model:
  reward_manager: dapo
  overlong_buffer:
    enable: False # We try to avoid forgetting to set enable
    len: 0
    penalty_factor: 0.0
    log: False

algorithm:
  # _target_: verl.trainer.config.AlgoConfig

  # # PowerFlow trajectory balance coefficient (β)
  # tb_coef: 15.0

  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False # We try to avoid forgetting to set enable
    metric: null # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0 # Non-positive values mean no upper limit

actor_rollout_ref:
  actor:
    # PowerFlow β coefficient for reward scaling in powerflow loss
    beta_coef: 4.0

    # PowerFlow initial reference log probability for ProjZModule offset calculation
    init_ref_log_prob: 0.36

    # Use boxed reward
    use_boxed_reward: True

    dtype: bfloat16

  ref:
    dtype: bfloat16

trainer:
  project_name: verl-powerflow
