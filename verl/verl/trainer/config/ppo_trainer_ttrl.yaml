hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

ttrl:
  # Whether to enable TTRL, refer to (https://arxiv.org/abs/2504.16084)
  enable: false

  # Number of rollouts per prompt, used for actual training
  n_samples_per_prompt: ${actor_rollout_ref.rollout.n}

  # Number of rollouts per prompt, used for label voting
  n_votes_per_prompt: ${actor_rollout_ref.rollout.n}

  # CPU processes for majority-vote answer extraction/simplification. 0 keeps
  # the original serial path.
  majority_vote_num_processes: 0

  # Skip majority pseudo-label generation for verifier-free PowerFlow-style
  # experiments. This keeps validation unchanged and only affects training.
  powerflow_no_majority: false

  # Experimental GRPO-compatible sharpened answer posterior reward. When
  # enabled, majority voting is still used to keep logging compatible, but the
  # training reward is replaced by a selective sharpened answer distribution.
  sharpened_enable: false
  sharpened_alpha: 2.0
  sharpened_tau_pos: 0.375
  sharpened_tau_marg: 0.125
  sharpened_use_confidence: true
  sharpened_conf_temperature: 1.0
  # prob keeps the original normalized sharpened posterior. top1_ratio keeps
  # the top accepted answer at reward 1 and gives other answers a relative
  # sharpened reward, preserving GRPO reward scale closer to majority voting.
  # mv_anchor keeps majority-vote matches at reward 1 and adds a small soft
  # posterior reward to non-majority accepted answers.
  sharpened_reward_mode: prob
  sharpened_soft_coef: 0.25
  sharpened_negative_enable: true
  sharpened_tau_low: 0.125
  sharpened_negative_reward: -0.25

  # Experimental chunk-level search-state training. This is disabled by
  # default and only used by explicit pilot scripts.
  chunk_state_enable: false
  chunk_state_score_mode: probe_reward
  chunk_state_candidates: 8
  chunk_state_chunk_size: 256
  chunk_state_probe_max_tokens: 3072
  chunk_state_probe_samples: 1
  # Optional staged future-support estimator. When enabled for
  # future_support_gain, all candidates first receive the normal cheap probes;
  # only top-k candidates under the full-rollout support transport signal get
  # additional deeper probes. Defaults are disabled for exact compatibility.
  chunk_state_staged_probe_enable: false
  chunk_state_staged_probe_topk: 2
  chunk_state_staged_probe_extra_samples: 4
  chunk_state_staged_probe_extra_max_tokens: ${ttrl.chunk_state_probe_max_tokens}
  # repeat_base keeps first-stage probes and appends extra probes for top-k.
  # extra_override uses extra probes as the final evidence for selected top-k
  # candidates while non-selected candidates keep first-stage probes.
  chunk_state_staged_probe_merge_mode: repeat_base
  chunk_state_states_per_prompt: 1
  chunk_state_max_prefix_tokens: 1024
  chunk_state_boundaries: [0, 256, 512, 768, 1024]
  # Keep 0 by default for backward compatibility. Diagnostic scripts can set a
  # positive value to prefer true mid-reasoning states over prompt-only states.
  chunk_state_min_boundary: 0
  # Defaults are conservative for compatibility. Experiments can require true
  # nonzero mid states and skip low-information batches that have no valid state.
  chunk_state_mid_require_nonzero_boundary: false
  chunk_state_skip_empty_state_batch: false
  chunk_state_alpha: 2.0
  chunk_state_eps: 0.05
  chunk_state_min_informative_gap: 0.0
  chunk_state_skip_uniform: false
  # If true, candidate entries marked inconsistent by a scorer/guard get zero
  # target mass instead of only receiving the small epsilon floor.
  chunk_state_zero_inconsistent_candidates: false
  # If true, physically drop zero-weight chunk samples from the actor batch.
  # This is off by default for exact backward compatibility with earlier pilots.
  chunk_state_prune_zero_weight_samples: false
  # Optional clipping for PowerFlow sample weights after chunk target assembly.
  # A non-positive value disables clipping. Renorm keeps nonzero mean close to 1
  # after clipping, preserving the loss scale while limiting single-sample spikes.
  chunk_state_powerflow_weight_clip: 0.0
  chunk_state_powerflow_weight_clip_renorm: true
  # Optional state-level confidence gate for chunk majority-completion targets.
  # Defaults are neutral, so existing experiments keep the same training
  # semantics unless launchers opt in.
  chunk_state_min_majority_ratio: 0.0
  chunk_state_min_answer_coverage: 0.0
  chunk_state_min_state_positive_margin: -1.0
  chunk_state_confidence_power: 0.0
  # Optional source-selection gates for support-driven chunk objectives.
  # Defaults are neutral. When enabled, they skip prompts/source rollouts whose
  # full-rollout answer support is too weak to define a reliable state target.
  chunk_state_min_prompt_top_mass: 0.0
  chunk_state_min_prompt_valid_answer_coverage: 0.0
  chunk_state_min_prompt_top_margin: 0.0
  chunk_state_max_prompt_answer_entropy: 0.0
  chunk_state_min_source_answer_mass: 0.0
  # Optional continuous state weighting from full-rollout support metadata.
  # This keeps source/support quality as a drift guard without hard-skipping
  # states. Defaults are neutral.
  # Supported modes: off, source_mass, prompt_top_mass, product,
  # prompt_valid_answer_coverage, prompt_top_margin, coverage_margin_product,
  # and group_quality. group_quality combines full-rollout valid-answer
  # coverage, answer top-margin, and an optional entropy penalty.
  chunk_state_source_quality_weight_mode: "off"
  chunk_state_source_quality_weight_floor: 0.0
  chunk_state_source_quality_weight_power: 1.0
  chunk_state_source_quality_max_entropy: 0.0
  # If enabled, candidate source rollouts are ranked by their answer mass under
  # the prompt-level full-rollout support before cycling. This keeps the
  # selected state path closer to high-support answers without hard-coding GT.
  chunk_state_source_select_by_mass: false
  # Support-source modes choose chunk states from full-rollout support metadata
  # while keeping full-group support anchors as the target distribution.
  # support_low prefers lower-source-mass states that still have valid answers;
  # support_mixed mixes low/high states by ratio for search-improvement smokes.
  chunk_state_source_mixed_low_ratio: 0.75
  chunk_state_source_low_max_answer_mass: 0.35
  chunk_state_source_min_valid_answer_mass: 0.03125
  # If enabled with majority_completion scoring, build PowerFlow targets from
  # candidates whose completions match the state-level majority label. This
  # keeps the 2504.16084 label-estimation semantics separate from soft
  # confidence weighting.
  chunk_state_label_consistent_only: false
  chunk_state_diag_enable: false
  # Optional JSONL path for per-state chunk/probe diagnostic rows. Empty means
  # disabled. Intended for short diagnostic runs, not long training jobs.
  chunk_state_diag_jsonl: null
  # random keeps the first pilot behavior. success prefers source rollouts that
  # are correct under original GT reward, falling back to random if none exist.
  # majority_consistent prefers full-rollout samples that match the prompt-level
  # majority pseudo-label, avoiding GT leakage while selecting cleaner states.
  chunk_state_source_mode: random
  chunk_state_boundary_mode: cycle
  chunk_state_mid_boundary_min_ratio: 0.25
  chunk_state_mid_boundary_max_ratio: 0.80
  chunk_state_skip_all_negative: false
  # Which response span receives the chunk-state actor loss. "chunk" preserves
  # the original pilot behavior. "chunk_probe" aligns the loss with the scored
  # chunk plus its probe continuation, truncated to the normal response budget.
  chunk_state_actor_span: chunk
  # If enabled, replace one sampled chunk candidate with the source rollout's
  # original next chunk to anchor the local target distribution on a successful path.
  chunk_state_teacher_anchor_enable: false
  chunk_state_teacher_anchor_score: 1.0
  chunk_state_teacher_anchor_candidate_index: 0
  # Optional compatibility gate for support-anchor proposals. When enabled,
  # a high-support full-rollout continuation is injected only if its prefix
  # before the current boundary matches the selected state source prefix. This
  # keeps anchors as state-compatible proposals, not cross-trajectory teachers.
  chunk_state_support_anchor_prefix_compat_enable: false
  # hard filters low prefix-match anchors. soft keeps them as proposals but
  # downweights their anchor prior by prefix-match, avoiding empty anchor sets.
  chunk_state_support_anchor_prefix_compat_mode: hard
  chunk_state_support_anchor_prefix_compat_tokens: 128
  chunk_state_support_anchor_min_prefix_match: 0.75
  chunk_state_support_anchor_prefix_score_power: 1.0
  chunk_state_support_anchor_skip_source: true
  # Optional post-scoring hard guard for chunk targets. It preserves the TTRL
  # order of estimating a full-rollout answer distribution before calculating
  # chunk rewards, then removes local targets with malformed answers or obvious
  # prompt-copy / repeated-boxed artifacts.
  chunk_state_target_guard_enable: false
  chunk_state_target_guard_max_boxed_count: 2
  chunk_state_target_guard_bad_probe_ratio: 0.5
  chunk_state_target_guard_min_answer_mass: 0.0
  chunk_state_target_guard_anchor: true
  chunk_state_target_guard_use_distribution_score: false
  # Candidate-level guard checks the next chunk itself before probe completion.
  # This catches local degeneration such as repeated boxed markers before it can
  # be rescued by a later probe answer.
  chunk_state_target_guard_candidate_enable: false
  chunk_state_target_guard_candidate_max_boxed_count: 1
  chunk_state_target_guard_candidate_assistant_marker: true
  # If enabled, use max(0, candidate_answer_mass - source_answer_mass) as the
  # distribution score. This keeps target construction tied to full-rollout
  # answer support and rewards local transitions that improve answer mass.
  chunk_state_target_guard_use_mass_gain: false
  # Score chunk candidates by the average mass of their future probe answers
  # under the original full-rollout answer support. This is a chunk-level
  # search-state improvement target, not a short-probe majority teacher.
  chunk_state_answer_support_score: mass
  chunk_state_answer_support_min_mass: 0.0
  # answer_source_consistency scores a candidate by whether its future probe
  # returns to the selected source rollout's final answer. This keeps each
  # chunk state tied to its own full-trajectory answer instead of any answer in
  # the global prompt support.
  chunk_state_answer_source_consistency_enable: false
  # future_support_gain uses the prompt-level full-rollout answer support as
  # label estimation, then scores a next chunk by whether longer-horizon probes
  # move future completions toward that support relative to the selected source
  # answer mass. The source chunk can enter as a prior, not a hard score floor.
  chunk_state_future_support_min_mass: 0.03125
  chunk_state_future_support_max_mass_coef: 0.25
  # Supported: slack_gain, positive_gain, relative_positive_gain,
  # tv_positive_gain, relative_tv_positive_gain, transport_affinity,
  # transport_positive_gain, transport_support_gain, plus smoothed_transport_*
  # variants, support_distribution_match, posterior_support_match, and
  # posterior_value_improvement. The
  # transport variants compare candidate future answer distributions to the
  # full-rollout support distribution with OOV answers counted as off-support
  # mass, so they are not local correctness teachers. posterior_support_match
  # first shrinks sparse probe evidence toward the full-rollout support
  # posterior, then scores support expected value / overlap / affinity, which
  # avoids letting short-horizon probe hits define the target alone.
  # posterior_value_improvement keeps that posterior/value signal but only
  # rewards candidates that improve over the state-local posterior-value mean,
  # so the actor learns a sharpened local transition rather than a flat support
  # match.
  chunk_state_future_support_score_type: slack_gain
  chunk_state_future_support_gain_slack: 0.125
  chunk_state_future_support_baseline_scale: 1.0
  chunk_state_future_support_source_prior_weight: 2.0
  # Optional prior multiplier for injected support-anchor candidates when using
  # future_support_gain. This is not a score floor: the future-support score
  # still defines the target, while full-rollout support only biases the
  # PowerFlow distribution toward higher-support proposal chunks.
  chunk_state_future_support_anchor_prior_weight: 0.0
  chunk_state_future_support_anchor_prior_power: 1.0
  chunk_state_future_support_prior_smoothing: 0.0
  chunk_state_future_support_min_positive_margin: 0.0
  # Optional state-level learnability gates for future_support_gain. Defaults
  # are neutral. These filter states whose chunk probes do not land inside the
  # full-rollout answer support often enough to define a reliable target.
  chunk_state_future_support_min_state_coverage: 0.0
  chunk_state_future_support_max_state_oov: 1.0
  chunk_state_future_support_min_state_mean_mass: 0.0
  chunk_state_future_support_min_state_max_mass: 0.0
  chunk_state_future_support_min_state_top_margin: 0.0
  # How actor batch uses future_support_keep. "hard" preserves older runs and
  # zeros a state when future_support_keep is false. "soft" keeps the state but
  # weights it by full-support coverage * max support mass, which avoids making
  # short-horizon local decidability the training bottleneck.
  chunk_state_future_support_keep_mode: hard
  chunk_state_future_support_soft_weight_floor: 0.0
  # Optional candidate-level quality gate for future_support_gain. It keeps the
  # target tied to prompt-level full-rollout answer support by dropping chunks
  # whose probes rarely land inside that support.
  chunk_state_future_support_min_candidate_coverage: 0.0
  chunk_state_future_support_min_candidate_mean_mass: 0.0
  # If enabled, inject the source rollout's original next chunk into one
  # candidate slot, but keep the normal probe-based PowerFlow soft target. This
  # is different from teacher_anchor: it does not force a score floor.
  chunk_state_source_chunk_enable: false
  chunk_state_source_chunk_candidate_index: 0
  # support_anchor injects several same-prompt full-rollout next chunks as
  # candidate anchors and scores them by the prompt-level full-rollout answer
  # support mass. This keeps the teacher defined by full-group label
  # estimation instead of short-horizon probe hits.
  # When enabled outside support_anchor/support_flow scoring, these anchors are
  # only candidate proposals; the active scorer still defines the target.
  chunk_state_support_anchor_enable: false
  chunk_state_support_anchor_count: 4
  chunk_state_support_anchor_candidate_start: 0
  chunk_state_support_anchor_min_mass: 0.03125
  # "mass_ranked" keeps the historical per-rollout ranking. "answer_stratified"
  # first covers distinct prompt-level support answers, then fills remaining
  # slots by mass. This makes anchor proposals closer to the full answer
  # support distribution instead of duplicating one high-mass answer.
  chunk_state_support_anchor_selection_mode: mass_ranked
  # support_flow uses the same full-rollout anchor candidates but scores them
  # with prompt-level full-rollout answer support. "gain" keeps the earlier
  # hard improvement smoke; "soft_mass" forms a conservative support replay
  # distribution; "softplus_gain" is a soft improvement target that compares
  # anchor support mass to the source baseline without making local positive
  # gain a hard decidability constraint at the chunk boundary.
  chunk_state_support_flow_score_type: gain
  # If true, candidates sharing the same full-rollout answer split that
  # answer's prompt-level support mass before flow scoring. This projects the
  # full answer distribution onto chunk anchors rather than counting duplicate
  # chunks from the same answer multiple times.
  chunk_state_support_flow_split_mass_by_answer: false
  # Posterior score types map full-rollout answer posterior mass onto support
  # anchors. Keep historical exact answer-mass projection by default; smoke
  # scripts can disable this to test whether repeated high-posterior chunks
  # should each retain the answer-level target mass.
  chunk_state_support_flow_posterior_split_duplicates: true
  # Exponent on the number of same-answer anchors when split_mass_by_answer is
  # enabled. 1.0 is an exact split; values in (0, 1) partially preserve the
  # margin of repeated high-support transitions while still penalizing
  # duplicate-answer overcounting.
  chunk_state_support_flow_answer_split_power: 1.0
  chunk_state_support_flow_gain_slack: 0.0
  chunk_state_support_flow_baseline_scale: 1.0
  chunk_state_support_flow_source_prior_weight: 1.0
  chunk_state_support_flow_min_positive_margin: 0.0
  chunk_state_support_flow_softplus_temperature: 0.125
