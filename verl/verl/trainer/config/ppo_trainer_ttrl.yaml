hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

ttrl:
  # Whether to enable TTRL, refer to (https://arxiv.org/abs/2504.16084)
  enable: false

  # Number of rollouts per prompt, used for actual training
  n_samples_per_prompt: ${actor_rollout_ref.rollout.n}

  # Number of rollouts per prompt, used for label voting
  n_votes_per_prompt: ${actor_rollout_ref.rollout.n}

  # === SPS reward variant (replaces majority voting) ===
  # When sps_enable=true, the reward is derived from the base-model sequence
  # logprob over K low-temperature rollouts.
  #
  # Reward modes:
  #   "group_norm_base"  (default, RL-friendly): per-prompt z-score of
  #         (alpha * logp_base - logq) / len      -> dense, zero-mean over K
  #   "softmax_weight"   (selection view, ablation): softmax_K(logw)
  #         -> tends to collapse to a single rollout, sparse gradients
  #   "answer_weighted_vote": cluster rollouts by final answer, choose the
  #         pseudo label with answer-level logsumexp SPS weight, then train with
  #         normal 0/1 self-consistency reward against that pseudo label.
  #   "answer_weighted_gate": start from majority vote and only let SPS override
  #         when SPS confidence is high and majority confidence is low.
  #   "answer_conf_filter": keep the majority-vote pseudo label, but zero out
  #         rewards for prompts where neither majority confidence nor SPS
  #         agreement confidence is high.
  #   "answer_conf_weight": keep the majority-vote pseudo label, but multiply
  #         rewards by a continuous prompt confidence from majority ratio,
  #         SPS-majority agreement confidence, and optional clip penalty.
  #   "answer_rule_conf_weight": same confidence weighting as answer_conf_weight,
  #         but keeps the rule-based 0/1 reward against the majority pseudo
  #         label instead of replacing it with dense SPS sequence reward.
  sps_enable: false

  # Low-temperature proposal temperature used both for sampling the K rollouts
  # and for the alpha = 1/T scaling in the SPS weight (matches the K=32 finding).
  sps_proposal_temperature: 0.25

  # Temperature used only for alpha=1/T in answer_weighted_vote. This decouples
  # high-temperature training exploration from the original low-temperature SPS
  # selection prior.
  sps_weight_temperature_base: ${ttrl.sps_proposal_temperature}

  # Reward shaping mode.
  sps_reward_mode: group_norm_base

  # Whether to length-normalize the sequence logweight (recommended).
  sps_length_normalize: true

  # Temperature of the per-prompt softmax (softmax_weight mode only).
  sps_weight_temperature: 1.0

  # Gate thresholds for answer_weighted_gate.
  sps_gate_confidence_threshold: 0.8
  sps_gate_majority_ratio_threshold: 0.75

  # Filter thresholds for answer_conf_filter.
  sps_filter_confidence_threshold: 0.8
  sps_filter_majority_ratio_threshold: 0.75

  # Continuous weighting controls for answer_conf_weight.
  sps_weight_floor: 0.25
  sps_clip_penalty: 0.0
  sps_weight_power: 1.0

  # Answer-cluster distribution sharpening. beta=1 and capacity=false preserve
  # the historical v14 behavior. beta>1 sharpens the per-prompt answer target
  # distribution after logZ normalization; capacity=true uses that sharpened
  # agreement confidence in the prompt-level training capacity.
  sps_answer_sharpen_beta: 1.0
  sps_answer_sharpen_capacity: false
  sps_consistency_capacity: false
  sps_consistency_disagreement_penalty: 0.5
  sps_low_budget_capacity: false
  sps_low_budget_k: 4
  sps_low_budget_disagreement_penalty: 0.35
  sps_base_support_capacity: false
  sps_base_support_temperature: 1.0
  sps_base_support_disagreement_penalty: 0.35
  sps_cross_view_capacity: false
  sps_cross_view_disagreement_penalty: 0.35
  sps_margin_capacity: false
  sps_margin_capacity_floor: 0.35
  sps_process_consistency_capacity: false
  sps_process_tail_fraction: 0.5
  sps_process_disagreement_penalty: 0.35
  sps_process_sample_weight: false
  sps_process_sample_positive: 1.25
  sps_process_sample_inconsistent: 0.75
  sps_process_sample_negative: 0.35
  sps_process_sample_invalid: 0.25
  sps_low_budget_negative_reward: false
  sps_low_budget_negative_value: 0.35
  sps_low_budget_negative_min_support: 0.65
  sps_low_budget_negative_process_min: 0.70
  sps_low_budget_negative_base_min: 0.65
  sps_low_budget_soft_reward: false
  sps_low_budget_soft_value: 0.25
  sps_low_budget_rescue_reward: false
  sps_low_budget_rescue_value: 0.15
  sps_low_budget_rescue_min_base: 0.08
  sps_low_budget_rescue_min_process: 0.50
  sps_low_budget_rescue_min_cluster_mass: 0.03125
  sps_low_budget_rescue_min_support: 0.15
  sps_low_budget_local_reward: false
  sps_low_budget_local_value: 0.12
  sps_low_budget_local_min_mass: 0.50
  sps_low_budget_local_min_base: 0.08
  sps_low_budget_local_min_process: 0.50
  sps_low_budget_local_min_support: 0.15
  sps_independent_support_reward: false
  sps_independent_support_value: 0.18
  sps_independent_support_min_base: 0.12
  sps_independent_support_min_process: 0.65
  sps_independent_support_min_cluster_mass: 0.0625
  sps_independent_support_min_support: 0.20
  sps_independent_support_entropy_gate: 1.15
  sps_independent_support_allow_majority: true
  sps_independent_support_majority_margin_max: 1.0
  sps_independent_support_competition_min: 0.0
  sps_process_answer_reward: false
  sps_process_answer_value: 0.16
  sps_process_answer_min_base: 0.10
  sps_process_answer_min_process: 0.60
  sps_process_answer_min_support: 0.20
  sps_process_answer_majority_scale: 0.50
  sps_contrastive_alt_reward: false
  sps_contrastive_alt_value: 0.14
  sps_contrastive_alt_majority_penalty: 0.06
  sps_contrastive_alt_min_base: 0.08
  sps_contrastive_alt_min_process: 0.60
  sps_contrastive_alt_min_support: 0.18
  sps_contrastive_alt_sharp_min: 0.92
  sps_contrastive_alt_effective_k_max: 1.35
  sps_contrastive_alt_low_budget_mass_min: 0.70
  sps_contrastive_alt_majority_support_min: 0.70
  sps_entropy_band_capacity: false
  sps_entropy_band_min_weight: 0.45
  sps_entropy_band_low_k: 1.25
  sps_entropy_band_high_k: 4.0
  sps_entropy_band_sharp_min: 0.92
  sps_entropy_band_low_budget_mass_min: 0.70
  sps_entropy_band_support_min: 0.70
  sps_low_budget_rebalance_reward: false
  sps_low_budget_rebalance_alt_value: 0.10
  sps_low_budget_rebalance_majority_penalty: 0.04
  sps_low_budget_rebalance_sharp_min: 0.92
  sps_low_budget_rebalance_effective_k_max: 1.35
  sps_low_budget_rebalance_mass_min: 0.70
  sps_low_budget_rebalance_support_min: 0.70
  sps_low_budget_rebalance_min_base: 0.06
  sps_low_budget_rebalance_min_process: 0.55
  sps_low_budget_rebalance_min_support: 0.12
  sps_process_quality_reward: false
  sps_process_quality_positive: 0.08
  sps_process_quality_negative: 0.10
  sps_process_quality_sharp_min: 0.92
  sps_process_quality_effective_k_max: 1.35
  sps_process_quality_mass_min: 0.70
  sps_process_quality_majority_scale: 0.25
  sps_process_quality_nonmajority_scale: 1.0
  sps_process_quality_bad_majority_scale: 1.0
  sps_process_quality_bad_nonmajority_scale: 0.5
  sps_anti_collapse_capacity: false
  sps_anti_collapse_min_weight: 0.45
  sps_anti_collapse_sharp_min: 0.95
  sps_anti_collapse_effective_k_max: 1.25
  sps_anti_collapse_low_budget_mass_min: 0.75
  sps_anti_collapse_margin_gap_min: 0.15
  sps_support_conflict_capacity: false
  sps_support_conflict_min_weight: 0.15
  sps_support_conflict_sharp_min: 0.90
  sps_support_conflict_effective_k_max: 2.0
  sps_support_conflict_base_min: 0.55
  sps_support_conflict_low_budget_min: 0.50
  sps_support_conflict_process_min: 0.70
  # Direct sharpened-probability TTRL. Set sps_reward_mode to
  # "direct_sharpened_prob" to bypass majority pseudo-label training and
  # fit a PowerFlow-style target distribution over answer clusters:
  # softmax_a logsumexp_{y extracts a}(beta * logp_ref(y|x) - logp_rollout(y|x)).
  sps_direct_beta: 4.0
  sps_direct_target_temperature: 1.0
  sps_direct_reward_scale: 1.0
  # "answer_mass" / "mass_div_count" spreads each answer cluster's target mass
  # across its sampled trajectories. "answer_prob" gives every trajectory in a
  # cluster the same answer probability. "trajectory_prob" normalizes directly
  # over parseable trajectories.
  sps_direct_per_sample_mode: answer_mass
  sps_direct_reward_floor: 0.0
  # For "process_tilted_sharpened_prob", tilt the direct target with
  # verifier-free trajectory quality and answer-cluster process stability
  # before answer-level softmax. These are default-off for v63 compatibility.
  sps_direct_process_tilt_strength: 0.0
  sps_direct_process_cluster_tilt_strength: 0.0
  # For "contrastive_process_sharpened_prob", subtract answer support already
  # explained by the frozen base/ref distribution before answer-level softmax.
  # Default 0.0 keeps v63/v64 behavior unchanged.
  sps_direct_base_contrast_strength: 0.0
  # For "gated_contrastive_process_sharpened_prob", gate the base contrast by
  # comparing frozen base/ref cluster support against process-stability support.
  # This avoids globally suppressing correct base-supported clusters.
  sps_direct_base_contrast_gate_strength: 0.0
  sps_direct_base_contrast_process_margin: 0.0
  # For "band_limited_process_sharpened_prob", constrain the soft target's
  # answer-level effective K before emitting rewards. This prevents v64-style
  # single-basin lock-in and v65/v66-style high-entropy wrong-basin diffusion
  # without using majority pseudo labels.
  sps_direct_target_effective_k_min: 0.0
  sps_direct_target_effective_k_max: 0.0
  sps_direct_target_effective_k_strength: 0.0
  # For "count_neutral_process_sharpened_prob", remove raw cluster-count
  # advantage from answer aggregation by using log-mean-exp over trajectories
  # in each answer cluster. This prevents the target from becoming majority
  # pseudo-label imitation while keeping a soft distribution.
  sps_direct_count_neutral_aggregation: false
  # For "pairwise_process_count_neutral_sharpened_prob", add a Bradley-Terry
  # style pairwise process-preference tilt to the count-neutral answer target.
  # This is default-off and uses only verifier-free trajectory stability
  # features such as parseability, non-clipping, final-box stability, and
  # absence of revision/conflict after the final answer.
  sps_direct_pairwise_process_preference_strength: 0.0
  sps_direct_pairwise_process_preference_temperature: 1.0
  # For "support_gated_process_sharpened_prob", tilt the direct soft target by
  # a continuous support distribution from frozen base/ref probability,
  # first-low-budget answer stability, and process-clean support. This is a
  # soft distribution gate, not a majority pseudo-label or hard reward.
  sps_direct_support_gate_strength: 0.0
  sps_direct_support_gate_temperature: 1.0
  sps_direct_support_gate_floor: 0.05
  sps_direct_support_gate_base_weight: 1.0
  sps_direct_support_gate_low_budget_weight: 1.0
  sps_direct_support_gate_process_weight: 1.0
  # For "support_mixture_process_sharpened_prob", conservatively mix an
  # over-sharp direct target back toward the same base/low-budget/process
  # support distribution. This is default-off and is a soft target constraint,
  # not a hard label or majority-selection rule.
  sps_direct_support_mixture_strength: 0.0
  sps_direct_support_mixture_confidence_threshold: 0.85
  sps_direct_support_mixture_effective_k_threshold: 2.0
  sps_direct_support_mixture_overlap_threshold: 0.85
  # For "support_calibrated_process_sharpened_prob", preserve the direct
  # target top answer but cap its confidence when it is much sharper than the
  # independent base/low-budget/process support distribution.  Excess top mass
  # is softly redistributed by support, so this is not answer selection.
  sps_direct_support_confidence_cap_strength: 0.0
  sps_direct_support_confidence_cap_margin: 0.20
  sps_direct_support_confidence_cap_min: 0.55
  # For "support_residual_process_sharpened_prob", add a default-off residual
  # target-logit tilt log p_support(a) - log p_base(a). This keeps the target
  # soft while pushing against base-only wrong basins when first-low-budget and
  # process support provide independent evidence.
  sps_direct_support_residual_strength: 0.0
  # For "split_support_process_sharpened_prob", construct two verifier-free
  # support views from first-low-budget samples and held-out process-clean
  # samples, then tilt target logits by their geometric-mean distribution.
  sps_direct_split_support_strength: 0.0
  sps_direct_split_support_floor: 0.05
  # For "capacity_braked_process_sharpened_prob", detect stable
  # overconfidence by target confidence/effective-K plus target-support
  # overlap, then softly mix toward a softened support distribution. This is
  # default-off and only controls answer capacity; it does not select an answer.
  sps_direct_capacity_brake_strength: 0.0
  sps_direct_capacity_brake_min_effective_k: 0.0
  sps_direct_capacity_brake_confidence_threshold: 1.0
  sps_direct_capacity_brake_overlap_threshold: 1.0
  # For "basin_contrast_process_sharpened_prob", cap the target top-vs-second
  # answer margin by base/first-low-budget/process support margins. This keeps
  # sharpening proportional to independent basin evidence and remains a soft
  # distribution rule, not answer selection.
  sps_direct_basin_contrast_strength: 0.0
  sps_direct_basin_contrast_margin: 0.0

  # Source for the base/internal logprob used by SPS confidence weighting.
  # "ref" keeps the historical behavior and uses the reference-policy worker.
  # "actor" avoids an independent ref worker and scores with the current actor.
  # "rollout" reuses rollout_log_probs directly.
  sps_base_logprob_source: ref

  # Downsampling policy after n_votes_per_prompt rollouts are used for voting.
  # "first" keeps the historical behavior. "majority_first" prioritizes
  # rollouts whose extracted answer matches the majority pseudo label.
  # "sharpened_cluster" additionally ranks candidates by parseability,
  # non-clipping, and reference-reweighted sequence score within the answer
  # cluster, sharpening the train distribution without true labels.
  # "low_budget_repair" keeps the historical first samples, but repairs only
  # the first low-budget slots with parseable/non-clipped majority-cluster
  # candidates when such candidates exist later in the train rollout set.
  # "base_supported_repair" keeps the same narrow low-budget repair scope, but
  # only accepts a repair candidate when it has better base/ref support than the
  # low-budget slot it replaces.
  sps_rollout_selection: first
  sps_selection_temperature: ${ttrl.sps_weight_temperature_base}
  sps_selection_require_majority: true
  sps_selection_cluster_bonus: 4.0
  sps_selection_parseable_bonus: 2.0
  sps_selection_nonclip_bonus: 1.0
  sps_selection_priority: score
  sps_selection_contrast_count: 4
  sps_selection_contrast_min_cluster_ratio: 0.5
  sps_selection_capacity: false
  sps_selection_capacity_floor: 0.5
  sps_selection_capacity_power: 1.0
  sps_low_budget_repair_max_replacements: 4
  sps_base_supported_repair_min_gain: 0.0

  # Optional unsupervised self-consistency reward mixed into SPS modes. This is
  # the 0/1 reward against the rollout majority pseudo label, not true labels.
  sps_majority_reward_coef: 0.0

  # Optional unsupervised format anchor. Adds the reward function's format_score
  # to the pseudo-label reward before SPS prompt weighting. For MATH-TTT this is
  # 1 when a boxed answer can be parsed and 0 otherwise; it does not use the
  # true answer.
  sps_format_reward_coef: 0.0

  # Throughput-only switches. When enabled, reuse logprobs already computed
  # during SPS rollout/scoring for the selected train rollouts instead of
  # recomputing them later in the PPO step. Defaults preserve historical
  # behavior.
  sps_reuse_rollout_log_probs_as_old: false
  sps_reuse_base_log_probs_as_ref: false

trainer:
  # Optional test-time self-consistency selection for validation. When enabled,
  # validation first generates many candidates per prompt, selects one answer
  # cluster using only extracted predictions, then repeats that selected sample
  # so the existing reducer reports the selected result under mean@4. Raw
  # uncollapsed validation metrics are kept under val-raw/*.
  validation_answer_selection_enable: false
  validation_answer_selection_repeats: 4
  validation_answer_selection_strategy: majority
  validation_answer_selection_logprob_beta: 1.0
  validation_answer_selection_clip_penalty: 0.25
